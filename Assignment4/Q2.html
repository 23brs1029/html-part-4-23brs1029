<html>
<head>
    <title>Online Event Registration</title>
</head>
<body>
    <h2>Online Event Registration Form</h2>
    <form>
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="sample@domainname.com">
        <br><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required placeholder="123-456-7890">
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
        <br><br>

        <label for="ageGroup">Age Group:</label>
        <select id="ageGroup" name="ageGroup" required>
            <option value="">Select your age group</option>
            <option value="Under 18">Under 18</option>
            <option value="18-24">18-24</option>
            <option value="25-34">25-34</option>
            <option value="35-44">35-44</option>
            <option value="45-54">45+</option>
        </select>
        <br><br>
        <label>Topics of Interest:</label><br>
        <input type="checkbox" id="technology" name="topics" value="Technology">
        <label for="technology">Technology</label><br>
        <input type="checkbox" id="science" name="topics" value="Science">
        <label for="science">Science</label><br>
        <input type="checkbox" id="arts" name="topics" value="Arts">
        <label for="arts">Arts</label><br>
        <input type="checkbox" id="business" name="topics" value="Business">
        <label for="business">Business</label>
        <br><br>

        <label for="comments">Additional Comments:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Enter your comments"></textarea>
        <br><br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
